name: Build & Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: tar xzf azm-bundle.tgz --skip-old-files && ls -la
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bash ci/build.sh
        env:
          RUN_NUMBER: ${{ github.run_number }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: driver-v1.0.${{ github.run_number }}
          name: Driver App 1.0.${{ github.run_number }}
          files: web/azm-driver.apk
          make_latest: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
